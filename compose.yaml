services:
  # Info page
  nginx:
    image: nginx:1.27.4-perl
    environment:
      NGINX_PORT: 80
    volumes:
      - ./info_page:/usr/share/nginx/html:ro
    ports:
      - 80:80

  # Gateway
  kong:
    image: kong:2.8.5
    environment:
      KONG_DATABASE: off
      KONG_DECLARATIVE_CONFIG: /usr/kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    configs:
      - source: kong_config
        target: /usr/kong/declarative/kong.yml
    ports:
      - 8000:8000
      - 8443:8443
    healthcheck:
      test: ["CMD", "curl", "http://kong:8000"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Databases
  mysql:
    build:
      context: db/mysql/
      dockerfile: Dockerfile
    ports:
      - 3306:3306
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: pass
      MYSQL_DATABASE: msc_onlab
      MYSQL_USER: dev
      MYSQL_PASSWORD: pass
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 5s
      timeout: 60s
      retries: 5

  postgresql:
    build:
      context: db/postgres/
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: root
      POSTGRES_USER: root
      POSTGRES_PASSWORD: pass
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "db_prod"]
      interval: 5s
      timeout: 60s
      retries: 5

  # Identity Provider
  keycloak:
    image: docker.io/bitnami/keycloak:26.0.5
    ports:
      - 8080:8080
    restart: always
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: pass
      KEYCLOAK_CREATE_ADMIN_USER: true
      KEYCLOAK_DATABASE_USER: root
      KEYCLOAK_DATABASE_PASSWORD: pass
      KEYCLOAK_DATABASE_NAME: keycloak
      KEYCLOAK_EXTRA_ARGS: "--import-realm"
    configs:
      - source: keycloak_test_realm
        target: /opt/bitnami/keycloak/data/import/keycloak.default.realm.json
    depends_on:
      postgresql:
        condition: service_healthy

  # Backend
  db_migrator:
    build:
      context: api/db_migrator
      dockerfile: Dockerfile
    environment:
      MYSQL_USER: db_migrator_service_user
      MYSQL_PASSWORD: pass
      MYSQL_DATABASE: msc_onlab
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy

  auth:
    build:
      context: ./api/auth
      dockerfile: Dockerfile
    restart: always
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: 5000
      APP_DEBUG: True
      KEYCLOAK_SERVER_URL: http://keycloak:8080 # Kong OpenID Connect plugin is Enterprise plugin...
      KEYCLOAK_REALM_NAME: msc-onlab-test
      KEYCLOAK_CLIENT_ID: msc-onlab-microservice-client-test
      KEYCLOAK_CLIENT_SECRET: moo8oexa0Aitoon8chohCaeh8eith5ei
      KEYCLOAK_ADMIN_USERNAME: realmadmin
      KEYCLOAK_ADMIN_PASSWORD: Asdasd11
      METRICS_PREFIX: msc_onlab
      METRICS_APP_NAME: auth
    ports:
      - 5000:5000
    healthcheck:
      test: ["CMD", "curl", "http://kong:8000/auth/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  team:
    build:
      context: ./api/team
      dockerfile: Dockerfile
    restart: always
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: 5001
      APP_DEBUG: True
      KEYCLOAK_SERVER_URL: http://keycloak:8080 # Kong OpenID Connect plugin is Enterprise plugin...
      KEYCLOAK_REALM_NAME: msc-onlab-test
      KEYCLOAK_CLIENT_ID: msc-onlab-microservice-client-test
      KEYCLOAK_CLIENT_SECRET: moo8oexa0Aitoon8chohCaeh8eith5ei
      METRICS_PREFIX: msc_onlab
      METRICS_APP_NAME: team
      MYSQL_TEAM_USER: team_service_user
      MYSQL_TEAM_PASSWORD: pass
      MYSQL_DATABASE: msc_onlab
      MYSQL_TEAM_TABLE: teams
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      AUTH_SERVICE_HOST: auth
      AUTH_SERVICE_PORT: 5000
    ports:
      - 5001:5001
    healthcheck:
      test: ["CMD", "curl", "http://kong:8000/team/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      db_migrator:
        condition: service_completed_successfully

  task:
    build:
      context: ./api/task
      dockerfile: Dockerfile
    restart: always
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: 5002
      APP_DEBUG: True
      KEYCLOAK_SERVER_URL: http://keycloak:8080 # Kong OpenID Connect plugin is Enterprise plugin...
      KEYCLOAK_REALM_NAME: msc-onlab-test
      KEYCLOAK_CLIENT_ID: msc-onlab-microservice-client-test
      KEYCLOAK_CLIENT_SECRET: moo8oexa0Aitoon8chohCaeh8eith5ei
      METRICS_PREFIX: msc_onlab
      METRICS_APP_NAME: task
      MYSQL_TASK_USER: task_service_user
      MYSQL_TASK_PASSWORD: pass
      MYSQL_DATABASE: msc_onlab
      MYSQL_TASK_TABLE: tasks
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      TEAM_SERVICE_HOST: team
      TEAM_SERVICE_PORT: 5001
      AUTH_SERVICE_HOST: auth
      AUTH_SERVICE_PORT: 5000
    ports:
      - 5002:5002
    healthcheck:
      test: ["CMD", "curl", "http://kong:8000/task/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      db_migrator:
        condition: service_completed_successfully

  invitation:
    build:
      context: ./api/invitation
      dockerfile: Dockerfile
    restart: always
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: 5003
      APP_DEBUG: True
      KEYCLOAK_SERVER_URL: http://keycloak:8080 # Kong OpenID Connect plugin is Enterprise plugin...
      KEYCLOAK_REALM_NAME: msc-onlab-test
      KEYCLOAK_CLIENT_ID: msc-onlab-microservice-client-test
      KEYCLOAK_CLIENT_SECRET: moo8oexa0Aitoon8chohCaeh8eith5ei
      METRICS_PREFIX: msc_onlab
      METRICS_APP_NAME: invitation
      MYSQL_TASK_USER: invitation_service_user
      MYSQL_TASK_PASSWORD: pass
      MYSQL_DATABASE: msc_onlab
      MYSQL_TASK_TABLE: invitations
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      TEAM_SERVICE_HOST: team
      TEAM_SERVICE_PORT: 5001
      AUTH_SERVICE_HOST: auth
      AUTH_SERVICE_PORT: 5000
    ports:
      - 5003:5003
    healthcheck:
      test: ["CMD", "curl", "http://kong:8000/invitation/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      db_migrator:
        condition: service_completed_successfully

  # Monitoring
  prometheus:
    image: prom/prometheus:v3.0.0
    restart: always
    ports:
      - 9090:9090
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=1h'  # Keep data for only 1 hour
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 60s
      retries: 5
    depends_on:
      auth:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.3.1
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=pass
    configs:
      - source: grafana_datasources_config
        target: /etc/grafana/provisioning/datasources/datasource.yaml
      - source: grafana_dashboard_provisioner
        target: /etc/grafana/provisioning/dashboards/main.yaml
      - source: grafana_backend_dashboard
        target: /var/lib/grafana/dashboards/backend.json
    ports:
      - 3000:3000
    depends_on:
      prometheus:
        condition: service_healthy

configs:
  kong_config:
    file: ./api/kong/kong.yml
  keycloak_test_realm:
    file: ./keycloak/realm.json
  prometheus_config:
    file: ./monitoring/prometheus.yml
  grafana_datasources_config:
    file: ./monitoring/grafana_datasources.yml
  grafana_dashboard_provisioner:
    file: ./monitoring/grafana_dashboard_provisioner.yml
  grafana_backend_dashboard:
    file: ./monitoring/grafana_dashboard.json
