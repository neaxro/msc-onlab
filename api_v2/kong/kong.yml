_format_version: '2.1'

services:
  - name: auth_service
    url: http://auth:5000/
    routes:
      - name: auth_route
        paths:
          - /auth

  - name: household_service
    url: http://household:5001/
    routes:
      - name: household_route
        paths:
          - /household

  - name: keycloak_service
    url: http://keycloak:8080
    routes:
      - name: keycloak_route
        paths:
          - /keycloak
