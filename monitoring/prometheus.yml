global:
  scrape_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
        - prometheus:9090

  - job_name: backend-auth
    static_configs:
      - targets:
        - kong:8000
    metrics_path: /auth/metrics

  - job_name: backend-team
    static_configs:
      - targets:
        - kong:8000
    metrics_path: /team/metrics

  - job_name: backend-task
    static_configs:
      - targets:
        - kong:8000
    metrics_path: /task/metrics

  - job_name: backend-invitation
    static_configs:
      - targets:
        - kong:8000
    metrics_path: /invitation/metrics
