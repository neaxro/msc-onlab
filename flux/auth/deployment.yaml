apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-msc-dipterv-dev-auth
  template:
    metadata:
      labels:
        app: app-msc-dipterv-dev-auth
    spec:
      containers:
        - name: app-msc-dipterv-dev-auth
          image: axelnemes/msc-dipterv-dev:auth-2025-03-17-157d407c5e8b228bd587df0d068c7abe88e58fa0 # {"$imagepolicy": "flux-system:msc-dipterv-dev-auth"}
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: keycloak-config
            - secretRef:
                name: keycloak-config
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        capabilities:
          drop:
            - all
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/worker
                    operator: In
                    values:
                      - worker
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - rpw01
            - weight: 1
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - rpw02
